[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "change-impact-engine"
version = "0.1.0"
description = "Evidence-backed static impact heuristics for fictional Python fixtures"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cie = "cie.cli:main"

[tool.setuptools.packages.find]
include = ["cie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
